[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = arduino
; try mbed upload protocol if stlink/openocd fails
; use mbed mass-storage upload when board exposes MBED disk
upload_protocol = stlink
monitor_speed = 115200
build_flags =
  -DHAL_UART_MODULE_ENABLED
  -DENABLE_HWSERIAL1

